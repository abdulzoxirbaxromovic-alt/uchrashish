<!DOCTYPE html>
<html lang="uz" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sen uchun</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040c;--fg:#ffd9ec;--accent:#ff5fa8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
canvas{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}
#open{position:fixed;left:50%;transform:translateX(-50%);padding:10px 26px;border:1px solid var(--accent);border-radius:999px;background:rgba(255,95,168,.08);color:var(--fg);font-size:14px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:opacity .6s,background .3s}
#open:hover{background:rgba(255,95,168,.22);box-shadow:0 0 24px rgba(255,95,168,.22)}
#open:focus-visible,#letter:focus-visible,#close:focus-visible,#replay:focus-visible,#sound:focus-visible{outline:2px solid #ffd9ec;outline-offset:4px}
#open.hide{opacity:0;pointer-events:none}
#replay,#sound{z-index:5;position:fixed;padding:9px 16px;border:1px solid rgba(255,95,168,.55);border-radius:999px;background:rgba(18,8,19,.72);backdrop-filter:blur(10px);color:var(--fg);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .7s,background .25s,border-color .25s}
#replay{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
#sound{top:calc(16px + env(safe-area-inset-top,0px));left:16px}
#replay.show,#sound.show{opacity:.9;pointer-events:auto}
#replay:hover,#sound:hover{background:rgba(255,95,168,.18);border-color:var(--accent)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
@media(max-width:480px){#open{font-size:12px;padding:10px 22px}#cap{font-size:12px;letter-spacing:.08em}#letter{font-size:12px;padding:10px 20px}#msg{font-size:clamp(25px,8vw,34px)}#replay,#sound{font-size:10px;padding:8px 12px}}
#cap{position:fixed;left:0;right:0;bottom:calc(13% + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;letter-spacing:.12em;opacity:0;transition:opacity 2s;pointer-events:none;color:#ffb3d6}
#cap.show{opacity:.85}
#letter,#close{padding:10px 26px;border:1px solid var(--accent);border-radius:999px;background:rgba(255,95,168,.08);color:var(--fg);font-size:14px;letter-spacing:.15em;cursor:pointer}
#letter{position:fixed;left:50%;bottom:calc(4% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity 1.5s}
#letter.show{opacity:1;pointer-events:auto}
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(7,4,12,.82);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s}
#card.show{opacity:1;pointer-events:auto}
#box{width:min(560px,100%);max-height:88vh;overflow-y:auto;text-align:center;padding:22px 18px;border:1px solid rgba(255,95,168,.24);border-radius:24px;background:rgba(15,7,18,.78);box-shadow:0 18px 70px rgba(0,0,0,.35)}
#msg{font-family:"Great Vibes",cursive;font-size:clamp(26px,6.5vw,36px);line-height:1.4;color:#ffd9ec;min-height:3.2em;margin:0 0 18px;text-shadow:0 0 14px rgba(255,95,168,.5)}
#answerActions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 18px;position:relative;min-height:54px}
.choice,#sendPlan{padding:11px 24px;border:1px solid var(--accent);border-radius:999px;background:rgba(255,95,168,.12);color:var(--fg);font-size:13px;letter-spacing:.08em;cursor:pointer}
.choice.primary,#sendPlan{background:linear-gradient(135deg,rgba(255,95,168,.28),rgba(180,70,130,.2))}
.choice:hover,#sendPlan:hover{background:rgba(255,95,168,.26)}
#meetingForm{display:none;text-align:left;margin:12px auto 18px;max-width:440px}
#meetingForm.show{display:block}
#meetingForm label{display:block;color:#ffc2dd;font-size:12px;letter-spacing:.06em;margin:12px 0 6px}
#meetingForm input,#meetingForm select,#meetingForm textarea{box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid rgba(255,95,168,.38);border-radius:12px;background:rgba(255,255,255,.06);color:#ffe5f1;font:14px system-ui}
#meetingForm select option{background:#170d19;color:#ffe5f1}
#meetingForm textarea{min-height:66px;resize:vertical}
#formHint,#responseStatus{font-size:12px;line-height:1.5;color:#eab6ce;text-align:center}
#close{margin-top:4px}
[hidden]{display:none!important}
@media(max-width:480px){#box{padding:18px 14px;max-height:86vh}#answerActions{gap:8px}.choice,#sendPlan{padding:10px 18px;font-size:12px}}
#noBtn.fleeing{position:fixed;z-index:30;margin:0;touch-action:none;transition:left .4s cubic-bezier(.22,.8,.3,1),top .4s cubic-bezier(.22,.8,.3,1)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="bgMusic" src="music.mp3" preload="auto" playsinline></audio>
<button id="open">Ochish</button>
<div id="cap">Qalbimdagi eng go‘zal tuyg‘u — sensan</div>
<button id="letter">Xatni o‘qish</button>
<button id="sound" aria-label="Musiqani yoqish yoki pauza qilish">♫ Ovozni yoqish</button>
<button id="replay" aria-label="Animatsiyani qayta boshlash">↻ Yana ko‘rish</button>

<div id="card">
  <div id="box">
    <p id="msg"></p>
    <div id="answerActions" hidden>
      <button class="choice primary" id="yesBtn" type="button">Ha, albatta ❤️</button>
      <button class="choice" id="noBtn" type="button" tabindex="-1">Yo‘q</button>
    </div>
    <form id="meetingForm">
      <p style="text-align:center;color:#ffd0e5;font-size:14px;margin:4px 0 12px">Unda uchrashuvni birga rejalashtiraylik 🌹</p>
      <label for="meetDate">Qaysi kuni?</label>
      <input id="meetDate" name="date" type="date" required>
      <label for="meetTime">Soat nechida?</label>
      <input id="meetTime" name="time" type="time" required>
      <label for="meetPlaceType">Qayerda uchrashamiz?</label>
      <select id="meetPlaceType" name="placeType" required>
        <option value="">Joy turini tanlang</option>
        <option>Kafe</option>
        <option>Restoran</option>
        <option>Park yoki sayr joyi</option>
        <option>Boshqa jamoat joyi</option>
      </select>
      <label for="meetPlace">Aniq joy yoki taklif (ixtiyoriy)</label>
      <input id="meetPlace" name="place" type="text" maxlength="120" placeholder="Masalan, ikkovimizga qulay kafe">
      <label for="meetNote">Qo‘shimcha fikring (ixtiyoriy)</label>
      <textarea id="meetNote" name="note" maxlength="300" placeholder="Masalan, boshqa kun yoki joy ham taklif qilishing mumkin"></textarea>
      <button id="sendPlan" type="submit" style="display:block;margin:16px auto 8px">Javobni tayyorlash</button>
      <p id="formHint">Sana, vaqt va joyni o‘zingga qulay qilib tanla. Istalgan payt fikringni o‘zgartirishing mumkin.</p>
      <p id="responseStatus" role="status"></p>
    </form>
    <button id="close" type="button">Yopish</button>
  </div>
</div>
<script>
const NAME='Munisa';            // ← ismni shu yerda o‘zgartiring
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),btn=document.getElementById('open'),cap=document.getElementById('cap');
const N=5000,rnd=(a,b)=>a+Math.random()*(b-a);
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const GOLD=[255,214,140],PINK=[255,95,168],LIGHT=[255,190,220],DEEP=[200,20,100],GREEN=[90,230,150];
let W,H,D,R0,stage='envelope',P=[];
const M={x:-999,y:-999,on:false};

function line(a,x1,y1,x2,y2,n,c){n*=2.4;for(let i=0;i<n;i++){const t=Math.random();a.push([x1+(x2-x1)*t,y1+(y2-y1)*t,...c]);}}
function heart(a,cx,cy,s,n){n*=2.4;for(let i=0;i<n;i++){const t=rnd(0,6.283),k=Math.sqrt(Math.random());
  a.push([cx+16*Math.pow(Math.sin(t),3)*s*k,cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s*k,...PINK]);}}
function text(str,font,size,cx,cy,colFn,step){
  const o=document.createElement('canvas');o.width=W;o.height=H;const c=o.getContext('2d');
  c.font=font(size);const m=c.measureText(str).width;if(m>W*.86){size*=W*.86/m;c.font=font(size);}
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.fillText(str,cx,cy);
  const d=c.getImageData(0,0,W,H).data,out=[];
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128)out.push([x+rnd(-.6,.6),y+rnd(-.6,.6),...colFn(y,cy,size)]);
  return out;
}
const script=s=>`${s}px "Great Vibes",cursive`;
const sans=s=>`700 ${s}px system-ui,sans-serif`;

function assign(pts){
  for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]];}
  P.forEach((p,i)=>{const q=pts[i%pts.length],dup=i>=pts.length;
    p.tx=q[0]+(dup?rnd(-.8,.8):0);p.ty=q[1]+(dup?rnd(-.8,.8):0);p.tc=[q[2],q[3],q[4]];});
}

function build(){
  const cx=W/2;let pts=[];
  if(stage==='envelope'){
    const ew=Math.min(W*.72,380),eh=ew*.62,cy=H*.42,l=cx-ew/2,r=cx+ew/2,t=cy-eh/2,b=cy+eh/2;
    line(pts,l,t,r,t,260,GOLD);line(pts,l,b,r,b,260,GOLD);line(pts,l,t,l,b,170,GOLD);line(pts,r,t,r,b,170,GOLD);
    line(pts,l,t,cx,cy+eh*.08,230,GOLD);line(pts,r,t,cx,cy+eh*.08,230,GOLD);
    line(pts,l,b,cx-ew*.1,cy+eh*.05,90,[200,160,100]);line(pts,r,b,cx+ew*.1,cy+eh*.05,90,[200,160,100]);
    heart(pts,cx,cy-eh*.04,ew*.0125,260);
    pts=pts.concat(text('FOR YOU',sans,ew*.1,cx,cy+eh*.2,()=>[255,240,245],2));
    btn.style.top=(b+36)+'px';
  }else if(stage==='name'){
    pts=text(NAME,script,Math.min(150,W*.26),cx,H*.48,(y,cy,s)=>mix(LIGHT,PINK,Math.min(1,Math.abs(y-cy)/s+.2)),2);
  }else if(stage==='rose'){
    const Rr=Math.min(W*.2,H*.17),by=H*.34,ny=H*.78,ns=Math.min(64,W*.15),se=ny-ns*.7;
    for(let i=0;i<3600;i++){const f=i/3600,a=(i*2.39996)%6.283;let rr=Rr*Math.sqrt(f)*(.78+.22*Math.abs(Math.cos(3*a)));
      if(Math.random()<.25)rr*=1+rnd(0,.22);
      pts.push([cx+Math.cos(a)*rr,by+Math.sin(a)*rr*.9-(1-f)*Rr*.1,...mix(DEEP,LIGHT,Math.sqrt(f))]);}
    const sy=by+Rr*.8;
    for(let i=0;i<650;i++){const u=Math.random();pts.push([cx+Math.sin(u*Math.PI)*Rr*.08,sy+(se-sy)*u,...GREEN]);}
    [[-1,.45],[1,.68]].forEach(([dir,u])=>{const bx=cx+Math.sin(u*Math.PI)*Rr*.08,bY=sy+(se-sy)*u,len=Math.hypot(.9,.45);
      for(let i=0;i<260;i++){const s=Math.random(),w=Math.sin(s*Math.PI)*Rr*.16*rnd(-1,1);
        pts.push([bx+dir*.9/len*s*Rr*.7+dir*.45/len*w*-1,bY-.45/len*s*Rr*.7+.9/len*w,...GREEN]);}});
    pts=pts.concat(text(NAME,script,ns,cx,ny,(y,cy,s)=>mix(LIGHT,PINK,Math.min(1,Math.abs(y-cy)/s+.2)),2));
  }
  if(pts.length)assign(pts);
}

function resize(){
  D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#07040c';ctx.fillRect(0,0,W,H);
  R0=Math.min(W*.42,H*.3);build();
}

function frame(t){
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(7,4,12,.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const p of P){
    let tx=p.tx,ty=p.ty;
    if(stage==='swirl'){p.sa+=.025+(1-p.sr)*.06;tx=W/2+Math.cos(p.sa)*p.sr*R0;ty=H*.45+Math.sin(p.sa)*p.sr*R0*.33;}
    let fx=0,fy=0;
    if(M.on){const dx=p.x-M.x,dy=p.y-M.y,d2=dx*dx+dy*dy,rad=Math.min(130,W*.3);
      if(d2<rad*rad&&d2>.01){const d=Math.sqrt(d2),f=(1-d/rad)*(1-d/rad)*9;fx=dx/d*f;fy=dy/d*f;}}
    p.vx=(p.vx+(tx-p.x)*p.k+fx)*.87+rnd(-.1,.1);p.vy=(p.vy+(ty-p.y)*p.k+fy)*.87+rnd(-.1,.1);
    p.x+=p.vx;p.y+=p.vy;
    p.r+=(p.tc[0]-p.r)*.06;p.g+=(p.tc[1]-p.g)*.06;p.b+=(p.tc[2]-p.b)*.06;
    const a=.55+.45*Math.sin(t*.004+p.ph),s=p.s*(.8+.4*a);
    const ck=((p.r|0)<<16)|((p.g|0)<<8)|(p.b|0);
    if(ck!==p.ck){p.ck=ck;p.cs='rgb('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+')';}
    ctx.fillStyle=p.cs;ctx.globalAlpha=a;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
  }
  requestAnimationFrame(frame);
}

const bgMusic=document.getElementById('bgMusic');
const replayBtn=document.getElementById('replay');
const soundBtn=document.getElementById('sound');
let musicStarted=false;
function updateSoundButton(){
  if(!soundBtn)return;
  soundBtn.textContent=bgMusic.paused?'♫ Ovozni yoqish':'♫ Musiqa: pauza';
}
function playMusicFromTap(){
  if(!bgMusic)return;
  soundBtn.classList.add('show');
  // play() is called immediately inside the actual tap/click handler so
  // mobile browsers recognize it as a user-initiated playback request.
  try{
    if(bgMusic.ended)bgMusic.currentTime=0;
    bgMusic.volume=0.48;
    const result=bgMusic.play();
    if(result && typeof result.then==='function'){
      result.then(()=>{musicStarted=true;updateSoundButton();})
        .catch(()=>{soundBtn.textContent='♫ Ovozni yoqish';soundBtn.classList.add('show');});
    }else{
      musicStarted=true;updateSoundButton();
    }
  }catch(err){
    soundBtn.textContent='♫ Ovozni yoqish';
    soundBtn.classList.add('show');
  }
}
bgMusic.addEventListener('play',updateSoundButton);
bgMusic.addEventListener('pause',updateSoundButton);
bgMusic.addEventListener('ended',()=>{musicStarted=false;updateSoundButton();});
bgMusic.addEventListener('error',()=>{soundBtn.textContent='♫ Audio xatosi';soundBtn.classList.add('show');});
soundBtn.addEventListener('click',()=>{
  if(bgMusic.paused){
    try{
      if(bgMusic.ended)bgMusic.currentTime=0;
      bgMusic.volume=0.48;
      const result=bgMusic.play();
      if(result && typeof result.catch==='function')result.catch(()=>{soundBtn.textContent='♫ Qayta urinib ko‘r';});
    }catch(err){soundBtn.textContent='♫ Qayta urinib ko‘r';}
  }else{
    bgMusic.pause();
  }
  updateSoundButton();
});
replayBtn.addEventListener('click',()=>{reset();start();});
function start(){
  playMusicFromTap();
  btn.classList.add('hide');
  const cx=W/2,cy=H*.42;
  for(const p of P){const an=Math.atan2(p.y-cy,p.x-cx)+rnd(-.5,.5),sp=rnd(6,18);p.vx+=Math.cos(an)*sp;p.vy+=Math.sin(an)*sp;
    p.sr=Math.sqrt(rnd(.04,1));p.sa=rnd(0,6.283);p.tc=[255,80+p.sr*110,160+p.sr*60];}
  stage='swirl';
  setTimeout(async()=>{try{await document.fonts.load('100px "Great Vibes"');}catch(e){}
    stage='name';build();},2800);
  setTimeout(()=>{stage='rose';build();cap.classList.add('show');letter.classList.add('show');replayBtn.classList.add('show');},6400);
}
function reset(){
  clearInterval(typer);card.classList.remove('show');cap.classList.remove('show');letter.classList.remove('show');
  replayBtn.classList.remove('show');resetNo();stage='envelope';build();
  btn.classList.remove('hide');M.on=false;
}

for(let i=0;i<N;i++)P.push({x:innerWidth/2+rnd(-60,60),y:innerHeight/2+rnd(-60,60),vx:rnd(-3,3),vy:rnd(-3,3),
  k:rnd(.02,.06),s:rnd(1,1.9),ph:rnd(0,6.283),r:255,g:200,b:220,tc:[255,200,220],tx:0,ty:0,sr:1,sa:0});
btn.addEventListener('click',start);
const setM=e=>{M.x=e.clientX;M.y=e.clientY;M.on=true;};
addEventListener('pointermove',setM);addEventListener('pointerdown',setM);
addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')M.on=false;});
addEventListener('pointercancel',()=>M.on=false);
document.addEventListener('pointerleave',()=>M.on=false);
const letter=document.getElementById('letter'),card=document.getElementById('card'),msg=document.getElementById('msg'),closeB=document.getElementById('close');
const LETTER='Necha yildirki do‘stmiz, ammo hali bir marta ham yuzma-yuz ko‘rishmadik. Men bilan uchrashishga nima deysan?';
let typer;
const answerActions=document.getElementById('answerActions');
const yesBtn=document.getElementById('yesBtn');
const noBtn=document.getElementById('noBtn');
const meetingForm=document.getElementById('meetingForm');
const responseStatus=document.getElementById('responseStatus');
function openLetter(){
  resetNo();
  card.classList.add('show');msg.textContent='';answerActions.hidden=true;meetingForm.classList.remove('show');
  responseStatus.textContent='';
  let i=0;clearInterval(typer);
  typer=setInterval(()=>{
    msg.textContent=LETTER.slice(0,++i);
    if(i>=LETTER.length){clearInterval(typer);answerActions.hidden=false;}
  },55);
}
letter.addEventListener('click',openLetter);
function setMinDate(){
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  document.getElementById('meetDate').min=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
yesBtn.addEventListener('click',()=>{
  setMinDate();
  answerActions.hidden=true;
  msg.textContent='Bu qaroring meni xursand qildi. Qani, uchrashuvni sen uchun ham qulay qilib kelishib olaylik. ❤️';
  meetingForm.classList.add('show');
});
// Hazil: "Yo‘q" tugmasi hech qachon bosilmaydi — yaqinlashsangiz yoki tegsangiz, qochib ketadi.
let noLast=0;
function resetNo(){noBtn.classList.remove('fleeing');noBtn.style.left='';noBtn.style.top='';noLast=0;}
function noGap(x,y){
  const b=noBtn.getBoundingClientRect();
  const dx=Math.max(b.left-x,0,x-b.right),dy=Math.max(b.top-y,0,y-b.bottom);
  return Math.hypot(dx,dy);
}
function noCenter(){const b=noBtn.getBoundingClientRect();return [b.left+b.width/2,b.top+b.height/2];}
// Tugma sichqoncha/barmoqdan 140-260 piksel narida, ekran ichida va "Ha" tugmasidan chetda silliq ko‘chadi.
function fleeNo(fromX,fromY,force){
  if(answerActions.hidden)return;
  const now=performance.now();
  if(!force&&now-noLast<220)return;
  noLast=now;
  const vw=innerWidth,vh=innerHeight,m=14;
  noBtn.classList.add('fleeing');
  const bw=noBtn.offsetWidth,bh=noBtn.offsetHeight;
  const yes=yesBtn.getBoundingClientRect();
  const c=noCenter();
  const free=(x,y)=>!(x<yes.right+18&&x+bw>yes.left-18&&y<yes.bottom+18&&y+bh>yes.top-18);
  let pos=null;
  for(let i=0;i<60&&!pos;i++){
    const ang=Math.random()*Math.PI*2,dist=140+Math.random()*120;
    const x=Math.min(Math.max(c[0]+Math.cos(ang)*dist-bw/2,m),Math.max(m,vw-bw-m));
    const y=Math.min(Math.max(c[1]+Math.sin(ang)*dist-bh/2,m),Math.max(m,vh-bh-m));
    if(Math.hypot(x+bw/2-fromX,y+bh/2-fromY)>=140&&free(x,y))pos={x,y};
  }
  if(!pos){ // yaqin joy topilmasa, ekrandagi eng uzoq bo‘sh joyga
    let bestD=-1;
    for(let i=0;i<80;i++){
      const x=m+Math.random()*Math.max(1,vw-bw-2*m),y=m+Math.random()*Math.max(1,vh-bh-2*m);
      if(!free(x,y))continue;
      const d=Math.hypot(x+bw/2-fromX,y+bh/2-fromY);
      if(d>bestD){bestD=d;pos={x,y};}
    }
  }
  if(!pos)pos={x:m,y:m};
  noBtn.style.left=pos.x+'px';noBtn.style.top=pos.y+'px';
}
function dodgeFrom(e){
  const t=(e&&e.touches&&e.touches[0])||(e&&e.changedTouches&&e.changedTouches[0])||e;
  if(t&&typeof t.clientX==='number')fleeNo(t.clientX,t.clientY,true);
  else{const c=noCenter();fleeNo(c[0],c[1],true);}
}
// Tugmaga har qanday tegish (sichqoncha, barmoq, klaviatura) hech narsa qilmaydi, faqat qochadi.
['pointerover','pointerdown','pointerup','mousedown','mouseup','click','touchstart','touchend'].forEach(type=>{
  noBtn.addEventListener(type,e=>{
    if(e.cancelable)e.preventDefault();
    e.stopImmediatePropagation();
    dodgeFrom(e);
  },{passive:false});
});
noBtn.addEventListener('focus',()=>{noBtn.blur();dodgeFrom(null);});
noBtn.addEventListener('keydown',e=>{e.preventDefault();dodgeFrom(null);});
noBtn.addEventListener('keyup',e=>{e.preventDefault();});
// Yaqinlashish: sichqoncha tugmadan ~40 px, barmoq ~25 px yaqinlashganda qochadi.
function nearCheck(e){
  if(answerActions.hidden)return;
  const r=e.pointerType==='mouse'?40:25;
  if(noGap(e.clientX,e.clientY)<r)fleeNo(e.clientX,e.clientY,false);
}
addEventListener('pointermove',nearCheck,{passive:true});
addEventListener('pointerdown',nearCheck,{passive:true});
addEventListener('touchstart',e=>{const t=e.touches[0];if(t)nearCheck({clientX:t.clientX,clientY:t.clientY,pointerType:'touch'});},{passive:true});
// Oyna o‘lchami o‘zgarsa (telefonda panel chiqsa) tugma sakramaydi, faqat ekran ichida qoladi.
addEventListener('resize',()=>{
  if(!noBtn.classList.contains('fleeing')||answerActions.hidden)return;
  const b=noBtn.getBoundingClientRect(),m=14;
  noBtn.style.left=Math.min(Math.max(b.left,m),Math.max(m,innerWidth-b.width-m))+'px';
  noBtn.style.top=Math.min(Math.max(b.top,m),Math.max(m,innerHeight-b.height-m))+'px';
});
meetingForm.addEventListener('submit',async(event)=>{
  event.preventDefault();
  const data=new FormData(meetingForm);
  const place=data.get('place')||'Hali tanlanmagan';
  const note=data.get('note')||'Yo‘q';
  const summary='Uchrashuv bo‘yicha javob\n'+
    'Javob: Ha\n'+
    'Sana: '+data.get('date')+'\n'+
    'Vaqt: '+data.get('time')+'\n'+
    'Joy turi: '+data.get('placeType')+'\n'+
    'Joy taklifi: '+place+'\n'+
    'Qo‘shimcha: '+note;
  try{
    if(navigator.share){
      await navigator.share({title:'Uchrashuv taklifi',text:summary});
      responseStatus.textContent='Javob ulashish oynasiga tayyorlandi. Uni menga yuborishing mumkin.';
    }else if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(summary);
      responseStatus.textContent='Javob nusxalandi. Uni xabar orqali menga yuborishing mumkin.';
    }else{
      const blob=new Blob([summary],{type:'text/plain;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='uchrashuv-javobi.txt';a.click();
      URL.revokeObjectURL(url);
      responseStatus.textContent='Javob fayl sifatida saqlandi. Uni menga yuborishing mumkin.';
    }
  }catch(err){
    if(err && err.name!=='AbortError')responseStatus.textContent='Ulashish amalga oshmadi. Qayta urinib ko‘r.';
  }
});
